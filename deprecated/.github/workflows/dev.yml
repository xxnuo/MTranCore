name: Dev Build

on:
  push:
    branches:
      - main

# 确保同一分支只运行最新的构建，取消旧的构建
concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.0"

jobs:
  build:
    name: Build Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          # Windows
          - goos: windows
            goarch: amd64
            suffix: ".exe"
          # macOS
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Build worker binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          make actions
          binary_name="worker-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}"
          mv build/worker "build/${binary_name}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/worker-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
          retention-days: 1

  release:
    name: Create Dev Build
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -name "worker-*" -type f -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Generate build info
        id: build_info
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "commit_date=$(git log -1 --format=%cd --date=short)" >> $GITHUB_OUTPUT
          echo "build_time=$(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_OUTPUT

      - name: Create checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Delete old dev release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 删除旧的 dev release（如果存在）
          if gh release view dev >/dev/null 2>&1; then
            echo "Deleting old dev release..."
            gh release delete dev --yes --cleanup-tag
          else
            echo "No existing dev release to delete"
          fi

      - name: Create Dev Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: "Dev Build"
          body: |
            ⚠️ This is an **automatically generated** pre-release build from the dev branch.
            **Not recommended for production use.**

            ### Build Information
            - **Commit**: ${{ steps.build_info.outputs.short_sha }}
            - **Commit Date**: ${{ steps.build_info.outputs.commit_date }}
            - **Build Time**: ${{ steps.build_info.outputs.build_time }}
            - **Commit Message**: ${{ github.event.head_commit.message }}
          files: |
            release-assets/*
          draft: false
          prerelease: true
          generate_release_notes: true
