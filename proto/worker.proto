syntax = "proto3";

package translator;

option go_package = "github.com/xxnuo/MTranCore/proto;proto";

// TranslatorService provides translation capabilities
service TranslatorService {
  // Health gets the current engine status
  rpc Health(HealthRequest) returns (HealthResponse);

  // Trans translates a single text
  rpc Trans(TransRequest) returns (TransResponse);

  // TransStream translates multiple texts in streaming fashion
  rpc TransStream(stream TransRequest) returns (stream TransResponse);

  // Exit shuts down the server
  rpc Exit(ExitRequest) returns (ExitResponse);
}

// HealthRequest is empty
message HealthRequest {}

// HealthResponse indicates whether an engine is loaded
message HealthResponse {
  int32 code = 1;
  string message = 2;
  bool health = 3;
}

// ExitRequest contains shutdown parameters
message ExitRequest {
  int32 time = 1;   // seconds to wait before shutdown
  bool force = 2;   // force shutdown without waiting
}

// ExitResponse indicates shutdown status
message ExitResponse {
  int32 code = 1;
  string message = 2;
}

// TransRequest contains the text to translate
message TransRequest {
  string text = 1;
  bool html = 2;
}

// TransResponse contains the translated text
message TransResponse {
  int32 code = 1;
  string message = 2;
  string translated_text = 3;
}