<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MTran Web Example</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 800px; margin: 0 auto; padding: 2rem; line-height: 1.5; }
      textarea { width: 100%; height: 100px; margin-bottom: 1rem; padding: 0.5rem; }
      .controls { display: flex; gap: 1rem; margin-bottom: 1rem; align-items: center; }
      button { padding: 0.5rem 1rem; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
      button:disabled { background: #ccc; cursor: not-allowed; }
      #output { background: #f4f4f4; padding: 1rem; min-height: 100px; border-radius: 4px; white-space: pre-wrap; }
      .status { font-size: 0.9em; color: #666; margin-top: 0.5rem; }
      .loading { color: #007bff; }
      .error { color: #dc3545; }
    </style>
  </head>
  <body>
    <h1>MTran Web Example</h1>
    <p>Client-side translation running entirely in your browser via WASM.</p>

    <div class="controls">
      <select id="fromLang">
        <option value="auto">Auto Detect</option>
        <option value="en">English</option>
        <option value="zh-Hans">Chinese (Simplified)</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
      </select>
      <span>→</span>
      <select id="toLang">
        <option value="zh-Hans">Chinese (Simplified)</option>
        <option value="en">English</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
      </select>
      <button id="translateBtn">Translate</button>
    </div>

    <textarea id="input" placeholder="Type text to translate...">Hello world! This is running in the browser.</textarea>
    
    <div id="status" class="status">Ready</div>
    <h3>Result:</h3>
    <div id="output"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
