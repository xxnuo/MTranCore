name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create release for (e.g., v1.0.0)"
        required: true
        type: string

# 确保同一 tag 只运行最新的构建，取消旧的构建
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.0"

jobs:
  build:
    name: Build Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Android (requires CGO)
          - goos: android
            goarch: amd64
            suffix: ""
            cgo_enabled: "1"
          - goos: android
            goarch: arm
            suffix: ""
            cgo_enabled: "1"
          - goos: android
            goarch: arm64
            suffix: ""
            cgo_enabled: "1"
          # macOS
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""
          # iOS (requires CGO)
          - goos: ios
            goarch: arm64
            suffix: ""
            cgo_enabled: "1"
          # JS
          - goos: js
            goarch: wasm
            suffix: ".wasm"
          # Linux
          - goos: linux
            goarch: 386
            suffix: ""
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          # Windows
          - goos: windows
            goarch: amd64
            suffix: ".exe"
          - goos: windows
            goarch: arm64
            suffix: ".exe"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.goos }}-${{ matrix.goarch }}-
            ${{ runner.os }}-go-

      - name: Cache protoc
        uses: actions/cache@v4
        id: cache-protoc
        with:
          path: /usr/local/bin/protoc
          key: ${{ runner.os }}-protoc-${{ hashFiles('.github/workflows/release.yml') }}

      - name: Cache Go tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-tools-${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Generate code
        run: |
          go generate ./...

      - name: Install protoc
        if: steps.cache-protoc.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Go protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Generate proto code
        run: |
          mkdir -p proto
          protoc --go_out=. --go_opt=paths=source_relative \
            --go-grpc_out=. --go-grpc_opt=paths=source_relative \
            proto/worker.proto

      - name: Build worker binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo_enabled }}
        run: |
          mkdir -p build
          binary_name="worker-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}"
          go build -ldflags="-s -w" -o "build/${binary_name}" ./cmd/worker

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/worker-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -name "worker-*" -type f -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: |
            ### Download
            Choose the appropriate binary for your platform:
            - `worker-linux-amd64` - Linux x86_64
            - `worker-linux-arm64` - Linux ARM64
            - `worker-windows-amd64.exe` - Windows x86_64
            - `worker-windows-arm64.exe` - Windows ARM64
            - `worker-darwin-amd64` - macOS Intel
            - `worker-darwin-arm64` - macOS Apple Silicon

            ### Installation
            1. Download the appropriate binary for your platform
            2. Make it executable (Linux/macOS): `chmod +x worker-*`
            3. Run: `./worker-*` or `worker-*.exe`

            ### Verification
            Use the provided `checksums.txt` to verify file integrity:
            ```bash
            sha256sum -c checksums.txt
            ```
          files: |
            release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
